<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台中YouBike地圖，使用OSM</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/roller.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/MarkerCluster.css" />
    <style>
      .marker-cluster-medium {
        background-color: rgba(111, 223, 6, 0.2);
      }
      .marker-cluster-medium div {
        background-color: rgba(12, 136, 252, 0.8);
      }
      .marker-cluster-small {
        background-color: rgba(218, 233, 10, 0.2);
      }
      .marker-cluster-small div {
        background-color: rgba(163, 20, 247, 0.8);
      }
      .marker-cluster div {
        width: 30px;
        height: 30px;
        margin-left: 5px;
        margin-top: 5px;
        font-size: 16px;
        font-weight: 900;
        text-align: center;
        border-radius: 50%;
      }
      .marker-cluster span {
        line-height: 30px;
      }
    </style>
  </head>
  <body>
    <section id="s02" class="bg-dark">
      <div class="container">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
          <div class="container-fluid">
            <a class="navbar-brand" href="0115spa_member_control_panel.html">
              <div class="h1">控制台</div>
            </a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="0115spa.html"
                    >首頁</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">保留功能</a>
                </li>
              </ul>
              <div>
                <span
                  class="h4 text-white fw-400 md-5 my-auto d-none"
                  id="s02_username_showtext"
                  >歡迎會員:<span
                    class="h4 text-success md-5"
                    id="s02_username_text"
                  ></span
                ></span>
                <button class="btn btn-light d-none" id="s02_loginout_btn">
                  登出
                </button>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </section>
    <div class="container-fluid">
      <div class="row vh-100">
        <div class="col-md-4 bg-001">
          <select
            name="myarea"
            id="myarea"
            class="form-select form-select-lg mt-3"
          >
            <option value="" selected disabled>---選擇鄉鎮區名稱---</option>
            <option value="南屯區">南屯區</option>
            <option value="北屯區">北屯區</option>
            <option value="西屯區">西屯區</option>
          </select>
          <ul
            class="list-group mt-3"
            id="mylist"
            style="height: 80vh; overflow: scroll"
          >
            <li class="list-group-item">
              <p class="h3 fw-900 text-info">xxYouBike</p>
              <p class="h5 fw-900">地址:xxxxx</p>
              <p class="h5 fw-900">資料更新時間:xxxxx</p>
              <p class="h5 fw-900">
                總停車格:<span class="h2 fw-900 text-warning">88</span>輛
              </p>
              <p class="h5 fw-900">
                車輛數量:<span class="h2 fw-900 text-warning">99</span>個
              </p>
            </li>
          </ul>
        </div>
        <div class="col-md-8 bg-002">
          <div id="map" class="vh-100 bg-003"></div>
        </div>
      </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/leaflet.markercluster.js"></script>
    <script src="js/leaflet-color-markers.js"></script>
    <script src="js/aurth.js"></script>
    <script>
      var allCityData; //所有縣市資料
      var youbikeData; //台中youbike資料

      var myarea; //紀錄所選的鄉鎮區名稱
      var map;
      var markers;

      $(function () {
        //drawmap
        map = L.map("map").setView([24.171642, 120.609483], 17);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        markers = new L.markerClusterGroup().addTo(map);

        // var popupHTML = `<img src="img/dt11.jpg" class="img-fluid">`;
        // L.marker([24.171642, 120.609483]).addTo(map).bindPopup(popupHTML);
        //.openPopup();

        //台中youbike資料
        $.ajax({
          type: "GET",
          url: "https://datacenter.taichung.gov.tw/swagger/OpenData/34a848ab-eeb3-44fd-a842-a09cb3209a7d",
          dataType: "json",
          success: function (data) {
            console.log(data);
            youbikeData = data.retVal;
            console.log(youbikeData);

            //產生台中youbike資料
          },
          error: function () {
            Swal.fire({
              title: "API介接錯誤?",
              text: "https://datacenter.taichung.gov.tw/swagger/OpenData/34a848ab-eeb3-44fd-a842-a09cb3209a7d",
              icon: "error",
            });
          },
        });

        //縣市資料
        $.ajax({
          type: "GET",
          url: "js/CityCountyData.json",
          dataType: "json",
          async: false,
          success: function (data) {
            // console.log(data);
            allCityData = data;
            console.log(allCityData);
          },
          error: function () {
            Swal.fire({
              title: "API介接錯誤?",
              text: "js/CityCountyData.json",
              icon: "error",
            });
          },
        });

        //產生台中市鄉鎮區選單
        allCityData.forEach(function (item) {
          if (item.CityName == "臺中市") {
            $("#myarea").empty();
            $("#myarea").append(
              '<option value="" selected disabled>---選擇鄉鎮區名稱---</option>'
            );
            item.AreaList.forEach(function (itemarea) {
              console.log(itemarea.AreaName);
              //產生鄉鎮區選單
              var strHTML = `<option value="${itemarea.AreaName}">${itemarea.AreaName}</option>`;
              $("#myarea").append(strHTML);
            });
          }
        });

        //監聽鄉鎮區選單
        $("#myarea").change(function () {
          //抹除地圖上所有marker
          removeMarker();

          console.log($(this).val());
          myarea = $(this).val();

          //過濾YouBike資料
          $("#mylist").empty();
          var counter = 0;
          youbikeData.forEach(function (item) {
            if (item.sarea == myarea) {
              console.log(item);
              counter++;
              if (counter == 1) {
                map.panTo([item.lat, item.lng]);
              }
              var strHTML = `<li class="list-group-item" data-sna="${item.sna}" data-ar="${item.ar}" data-mday="${item.mday}" data-tot="${item.tot}" data-sbi="${item.sbi}" data-lat="${item.lat}" data-lng="${item.lng}">
              <p class="h3 fw-900 text-info">${item.sna}</p>
              <p class="h5 fw-900">地址:${item.ar}</p>
              <p class="h5 fw-900">資料更新時間:${item.mday}</p>
              <p class="h5 fw-900">
                總停車格:<span class="h2 fw-900 text-warning">${item.tot}</span>輛
              </p>
              <p class="h5 fw-900">
                車輛數量:<span class="h2 fw-900 text-warning">${item.sbi}</span>個
              </p>
            </li>   `;
              $("#mylist").append(strHTML);

              //產生marker
              var popupHTML = `<div class="card">
                <div class="card-header h2 fw-900 text-bg-success">${item.sna}</div>
                <div class="card-body">
                <p class="h5 fw-900">地址:${item.ar}</p>
                <p class="h5 fw-900">資料更新時間:${item.mday}</p>
                <p class="h5 fw-900">
                    總停車格:<span class="h2 fw-900 text-warning">${item.tot}</span>輛
                </p>
                <p class="h5 fw-900">
                    車輛數量:<span class="h2 fw-900 text-warning">${item.sbi}</span>個
                </p>
              </div>
              </div>`;
              // L.marker([
              //   item.geometry.coordinates[1],
              //   item.geometry.coordinates[0],
              // ])
              //   .addTo(map)
              //   .bindPopup(popupHTML);
              markers.addLayer(
                L.marker([item.lat, item.lng], { icon: zulsIcon }).bindPopup(
                  popupHTML
                )
              );
            }
          });

          //監聽list-group-item
          $("#mylist .list-group-item").click(function () {
            console.log($(this).data("sna"));
            console.log($(this).data("ar"));
            console.log($(this).data("mday"));
            console.log($(this).data("tot"));
            console.log($(this).data("sbi"));
            console.log($(this).data("lat"));
            console.log($(this).data("lng"));

            markerPopup(
              $(this).data("sna"),
              $(this).data("ar"),
              $(this).data("mday"),
              $(this).data("tot"),
              $(this).data("sbi"),
              $(this).data("lat"),
              $(this).data("lng")
            );
          });
        });
      });

      //抹除地圖上所有marker
      // //https://leafletjs.com/reference.html
      // function removeMarker() {
      //   map.eachLayer(function (layer) {
      //     if (layer instanceof L.Marker) {
      //       map.removeLayer(layer);
      //     }
      //   });
      // }

      // use cluser抹除地圖上所有marker
      function removeMarker() {
        markers.eachLayer(function (layer) {
          if (layer instanceof L.Marker) {
            markers.removeLayer(layer);
          }
        });
      }

      function markerPopup(
        sna,
        ar,
        mday,
        tot,
        sbi,
        lat,
        lng
      ) {
        //產生marker
        var popupHTML = `<div class="card">
                <div class="card-header h2 fw-900 text-bg-success">${sna}</div>
                <div class="card-body">
                <p class="h5 fw-900">地址:${ar}</p>
                <p class="h5 fw-900">資料更新時間:${mday}</p>
                <p class="h5 fw-900">
                    總停車格:<span class="h2 fw-900 text-warning">${tot}</span>輛
                </p>
                <p class="h5 fw-900">
                    車輛數量:<span class="h2 fw-900 text-warning">${sbi}</span>個
                </p>
              </div>
              </div>`;
        L.marker([lat, lng]).addTo(map).bindPopup(popupHTML).openPopup();
      }

     
    </script>
  </body>
</html>
