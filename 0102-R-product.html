<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>麵食進貨管理介面-進貨列表</title>
    <link rel="stylesheet" href="css/roller.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/my.css" />

    <style>
      body {
        font-family: "Zen Maru Gothic", serif;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">麵食進貨管理介面</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="0102-C-product.html"
                >進貨建檔</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="0102-R-product.html">進貨列表</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-10">
          <table class="table table-rwd shadow-lg">
            <thead>
              <tr>
                <th>編號</th>
                <th>品名</th>
                <th>價格</th>
                <th>數量</th>
                <th>說明</th>
                <th>圖片</th>
                <th>建檔時間</th>
                <th>功能</th>
              </tr>
            </thead>
            <tbody id="mydata">
              <tr>
                <td data-th="編號">001</td>
                <td data-th="品名">XX</td>
                <td data-th="價格">XX</td>
                <td data-th="數量">XX</td>
                <td data-th="說明">XX</td>
                <td data-th="圖片">XX</td>
                <td data-th="建檔時間">XX</td>
                <td data-th="功能">
                  <button
                    class="btn btn-warning"
                    data-bs-toggle="modal"
                    data-bs-target="#updateModal"
                    data-id="XX"
                    data-pname="XX"
                    data-price="XX"
                    data-total="XX"
                    data-remark="XX"
                    data-created_at="XX"
                    id="update_btn"
                  >
                    更新
                  </button>
                  <button class="btn btn-danger">刪除</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- updateModal -->
    <div
      class="modal fade"
      id="updateModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header text-bg-warning">
            <h1 class="modal-title fs-5 fw-900" id="exampleModalLabel">
              產品更新
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="pname" class="form-label">品名</label>
              <input
                type="text"
                class="form-control"
                name="pname"
                id="pname"
                disabled
              />
            </div>
            <div class="mb-3">
              <label for="price" class="form-label">價格</label>
              <input
                type="number"
                class="form-control is-valid"
                name="price"
                id="price"
              />
              <div class="valid-feedback">符合規則</div>
              <div class="invalid-feedback">不符合規則</div>
            </div>
            <div class="mb-3">
              <label for="total" class="form-label">數量</label>
              <input
                type="number"
                class="form-control is-valid"
                name="total"
                id="total"
              />
              <div class="valid-feedback">符合規則</div>
              <div class="invalid-feedback">不符合規則</div>
            </div>
            <div class="mb-3">
              <label for="remark" class="form-label">說明</label>
              <textarea
                name="remark"
                id="remark"
                class="form-control is-valid"
              ></textarea>
              <div class="valid-feedback">符合規則</div>
              <div class="invalid-feedback">不符合規則</div>
            </div>
            <div class="mb-3">
              <label for="fileupload" class="form-label">圖片</label>
              <input
                type="file"
                class="form-control is-valid"
                name="fileupload"
                id="fileupload"
              />
              <div class="valid-feedback">符合規則</div>
              <div class="invalid-feedback">不符合規則</div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="updateModal_ok_btn"
            >
              確認
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      var flag_price = true;
      var flag_remark = true;
      var flag_total = true;
      var fileupload= true;

      var uid;
      $(function () {
        $.ajax({
          type: "GET",
          url: "http://192.168.10.71/web2024/0102-R.php",
          dataType: "json",
          async: false,
          success: showdata,
          error: function () {
            alert("error-http://192.168.10.71/web2024/0102-R.php"); //使用 sweetalert
          },
        });

        //監聽更新按鈕update_btn
        $("#mydata #update_btn").click(function () {
          console.log($(this).data("id"));
          console.log($(this).data("pname"));
          console.log($(this).data("price"));
          console.log($(this).data("total"));
          console.log($(this).data("remark"));
          console.log($(this).data("photo"));
          console.log($(this).data("created_at"));

          uid = $(this).data("id");
          $("#pname").val($(this).data("pname"));
          $("#price").val($(this).data("price"));
          $("#total").val($(this).data("total"));
          $("#remark").val($(this).data("remark"));
          $("#photo").val($(this).data("photo"));
        });

        //監聽刪除按鈕delete_btn
        $("#mydata #delete_btn").click(function () {
          Swal.fire({
            title: "確定刪除?",
            text: "確定刪除這筆資料",
            icon: "warning",
            allowOutsideClick: false,
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "確認",
          }).then((result) => {
            if (result.isConfirmed) {
              console.log($(this).data("id"));
              //傳遞至後端API執行刪除行為
              //input: {"id" : "XXX"}

              var JSONdata = {};
              JSONdata["id"] = $(this).data("id");
              console.log(JSON.stringify(JSONdata));

              $.ajax({
                type: "POST",
                url: "http://192.168.10.71/web2024/0102-D.php",
                data: JSON.stringify(JSONdata),
                dataType: "json",
                success: showdata_delete,
                error: function () {
                  alert("error-http://192.168.10.71/web2024/0102-D.php"); //sweetalert
                },
              });

              // Swal.fire({
              //   title: "刪除成功!",
              //   text: "資料已刪除.",
              //   icon: "success",
              // });
            }
          });
        });

        //即時監聽 price
        $("#price").bind("input propertychange", function () {
          if ($(this).val() > 0 && $(this).val() < 101) {
            $("#price").removeClass("is-invalid");
            $("#price").addClass("is-valid");
            flag_price = true;
          } else {
            $("#price").removeClass("is-valid");
            $("#price").addClass("is-invalid");
            flag_price = false;
          }
        });
        //即時監聽 total
        $("#total").bind("input propertychange", function () {
          if ($(this).val() > 0 && $(this).val() < 101) {
            $("#total").removeClass("is-invalid");
            $("#total").addClass("is-valid");
            flag_total = true;
          } else {
            $("#total").removeClass("is-valid");
            $("#total").addClass("is-invalid");
            flag_total = false;
          }
        });
        //即時監聽 remark
        $("#remark").bind("input propertychange", function () {
          if ($(this).val().length > 1 && $(this).val().length < 11) {
            $("#remark").removeClass("is-invalid");
            $("#remark").addClass("is-valid");
            flag_remark = true;
          } else {
            $("#remark").removeClass("is-valid");
            $("#remark").addClass("is-invalid");
            flag_remark = false;
          }
        });

        //監聽updateModal_ok_btn
        $("#updateModal_ok_btn").click(function () {
          if (flag_price && flag_remark) {
            //符合規定, 傳遞至後端API執行更新行為
            var JSONdata = {};
            JSONdata["id"] = uid;
            JSONdata["price"] = $("#price").val();
            JSONdata["total"] = $("#total").val();
            JSONdata["photo"] = $("#photo").val();
            JSONdata["remark"] = $("#remark").val();
            console.log(JSON.stringify(JSONdata));

            $.ajax({
              type: "POST",
              url: "http://192.168.10.71/web2024/0102-U.php",
              data: JSON.stringify(JSONdata),
              dataType: "json",
              success: showdata_updata,
              error: function () {
                alert("error-http://192.168.10.71/web2024/0102-U.php");
              },
            });
          } else {
            //不符合規定
            alert("欄位錯誤"); //sweetalert
          }
        });
      });
      
      function showdata(data) {
        console.log(data);

        if (data.state) {
           $("#mydata").empty();
          data.data.forEach(function (item) {
            var strHTML = `<tr>
                            <td data-th="編號">${item.ID}</td>
                            <td data-th="品名">${item.Pname}</td>
                            <td data-th="價格">${item.Price}</td>
                            <td data-th="數量">${item.Total}</td>
                            <td data-th="說明">${item.Remark}</td>
                            <td data-th="圖片">${item.Photo}</td>
                            <td data-th="建檔時間">${item.Created_at}</td>
                            <td data-th="功能">
                                <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#updateModal" data-id="${item.ID}"  data-pname="${item.Pname}"  data-price="${item.Price}" data-total="${item.Total}" data-remark="${item.Remark}
                                " data-remark="${item.Photo}
                                " data-created_at="${item.Created_at}" id="update_btn">更新</button>
                               <button class="btn btn-danger" data-id="${item.ID}" id="delete_btn">刪除</button>
                            </td>
                        </tr>`;
            $("#mydata").append(strHTML);
          });
        } else {
          alert(data.message); //使用 sweetalert
        }
      }

      function showdata_updata(data) {
        console.log(data);
        if (data.state) {
          Swal.fire({
            title: data.message,
            showDenyButton: false,
            showCancelButton: false,
            confirmButtonText: "確認",
            denyButtonText: `Don't save`,
            icon: "success",
            allowOutsideClick: false,
          }).then((result) => {
            /* Read more about isConfirmed, isDenied below */
            if (result.isConfirmed) {
              location.href = "0102-R-product.html";
            }
          });
        } else {
          Swal.fire({
            title: data.message,
            text: "error",
          });
        }
      }

      function showdata_delete(data) {
        console.log(data);
        if (data.state) {
          Swal.fire({
            title: data.message,
            showDenyButton: false,
            showCancelButton: false,
            confirmButtonText: "確認",
            denyButtonText: `Don't save`,
            icon: "success",
            allowOutsideClick: false,
          }).then((result) => {
            /* Read more about isConfirmed, isDenied below */
            if (result.isConfirmed) {
              location.href = "0102-R-product.html";
            }
          });
        } else {
          Swal.fire({
            title: data.message,
            text: "error",
          });
        }
      }
    </script>
  </body>
</html>
